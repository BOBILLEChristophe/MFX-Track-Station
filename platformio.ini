; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; "Build" and "Upload" in VS Code use the ESP32 only; the native
; environment is for unit tests (pio test -e native).
default_envs = esp32dev

[env:esp32dev]
; Platform pinned: pioarduino 55.03.312-1 brings the Arduino core 3.3.12
; (ESP-IDF 5.5): RMT and PCNT drivers of ESP-IDF 5 (driver/rmt_tx.h,
; driver/pulse_cnt.h). The official espressif32 platform stops at the core
; 2.0.17 (ESP-IDF 4.4), used up to version 0.12.0 (espressif32@6.9.0).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
build_flags = -DCORE_DEBUG_LEVEL=5
; Date of the build, shown at start-up (src/BuildInfo.cpp, generated)
extra_scripts = pre:tools/build_info.py
monitor_speed = 115200
lib_deps = 
	arduino-libraries/Ethernet@^2.0.2
	; CAN bus: version 2.x and later for the Arduino core 3.x (1.1.2 for the core 2.0)
	pierremolinaro/ACAN_ESP32@3.0.3
debug_tool = esp-prog
debug_init_break = tbreak setup

; Unit tests on the PC (no board needed):  pio test -e native
; Only the code in lib/ (MfxFrame) is built; src/ needs the ESP32.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++11 -Wall -Wextra
